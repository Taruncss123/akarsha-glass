type User @table {
  email: String!
  displayName: String!
  avatarUrl: String
  bio: String
}

type Project @table {
  name: String!
  owner: User!
  description: String
  createdAt: Timestamp
}

type Task @table {
  title: String!
  project: Project!
  status: String!
  description: String
  dueDate: Timestamp
  assignedTo: User
}

type Comment @table {
  content: String!
  task: Task!
  author: User!
  createdAt: Timestamp
}

type ProjectMember @table {
  project: Project!
  user: User!
  role: String!
}